[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "0.1.0"
description = "Synthetic IT operations incident data layer and ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "chromadb==1.5.9",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<4",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2.0.36,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
checkpoint = ["langgraph-checkpoint-postgres>=2.0,<4"]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "testcontainers[postgres]>=4.9,<5"]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
opspilot-data = "opspilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires a running PostgreSQL service"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

